services:
  - type: web
    name: holymove-api
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: node dist/index.js
    envVars:
      - key: NODE_VERSION
        value: 22.0.0
      - key: ORS_API_KEY
        sync: false          # set manually in Render dashboard
      - key: OPENROUTER_API_KEY
        sync: false          # set manually in Render dashboard if /api/ai-local is used
      - key: MONGODB_DISABLED
        value: "true"
      - key: MONGODB_DB_NAME
        value: holy_move
      - key: ALLOWED_ORIGINS
        value: https://holymovela.com,https://www.holymovela.com,https://ai-truck-helper-frontend.onrender.com,http://localhost:5173,http://localhost:4173
