[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "https://www.holymovela.com/*"
  to = "https://holymovela.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/*"
  to = "https://ai-truck-helper.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
